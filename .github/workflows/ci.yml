name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    # Task 12.9 — unit + integration tests (task 12.3's harness already
    # provisions/migrates/truncates TEST_DATABASE_URL itself via `npm test`,
    # so this job only needs to give it a real Postgres to point at and the
    # JWT_SECRET the session-token tests require).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: donation_app_backend_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/donation_app_backend_ci
      JWT_SECRET: backend-ci-secret
    defaults:
      run:
        working-directory: Code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  security:
    # Task 12.8/12.9 — the role/ownership spot-check as its own required
    # check, not just a step buried inside `backend`, per task 12.9's wording
    # treating it as a peer to unit/integration/E2E. Needs its own migrated
    # database since, unlike `npm test`, security-spot-check.js doesn't
    # migrate for itself (it assumes the schema already exists).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: donation_app_security_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/donation_app_security_ci
      JWT_SECRET: security-ci-secret
    defaults:
      run:
        working-directory: Code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx knex migrate:latest --env test
      - run: npm run security-check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm test

  e2e:
    # Task 12.5's trivial smoke test only needed the frontend. Task 12.6's
    # donor-journey test drives real signup/listing-creation through the
    # backend, so this job now provisions a throwaway Postgres service and
    # points the backend (started by playwright.config.js's webServer,
    # forced to NODE_ENV=test) at it via TEST_DATABASE_URL — never the real
    # dev database, same isolation principle as task 12.3's `npm test`.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: donation_app_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/donation_app_e2e
      JWT_SECRET: e2e-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies and migrate the test database
        working-directory: Code/backend
        run: |
          npm install
          npx knex migrate:latest --env test
      - name: Install frontend dependencies
        working-directory: Code/frontend
        run: npm install
      - name: Install Playwright browsers
        working-directory: Code/frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: Code/frontend
        run: npm run test:e2e
